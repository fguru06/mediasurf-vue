<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // GitHub Pages SPA workaround: store the intended path and redirect to index.html
    sessionStorage.setItem('gh-redirect', location.pathname + location.search + location.hash);
    location.replace('/');
  </script>
</head>
<body>
  <noscript>Please enable JavaScript or <a href="/">click here</a> to continue.</noscript>
</body>
</html>
